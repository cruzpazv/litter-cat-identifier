# Example section for a "sections" dashboard.
# Entity IDs depend on your litter box name, cat names and HA language:
# check Settings → Entities → filter "Litter Cat Identifier" and adjust.
# Here: litter box "Litter box", cats "Luna" and "Simba", HA in English.

type: grid
cards:
  - type: heading
    heading: Litter box
    icon: mdi:cat
    badges:
      - type: entity
        entity: sensor.litter_box_unidentified_visits_today

  # One card per cat: visits today · last visit · learned weight
  - type: custom:mushroom-template-card
    entity: sensor.litter_box_luna_weight
    picture: "{{ state_attr(entity, 'entity_picture') }}"
    primary: Luna
    secondary: >-
      {{ states('sensor.litter_box_luna_visits_today') }} visits today ·
      {% set t = states('sensor.litter_box_luna_last_visit') %}
      {{ 'last ' ~ relative_time(as_datetime(t)) ~ ' ago' if t not in ['unknown','unavailable'] else 'no visits yet' }}
    icon: mdi:cat
    icon_color: orange
    badge_icon: mdi:scale
    grid_options:
      columns: 6
  - type: custom:mushroom-template-card
    entity: sensor.litter_box_simba_weight
    picture: "{{ state_attr(entity, 'entity_picture') }}"
    primary: Simba
    secondary: >-
      {{ states('sensor.litter_box_simba_visits_today') }} visits today ·
      {% set t = states('sensor.litter_box_simba_last_visit') %}
      {{ 'last ' ~ relative_time(as_datetime(t)) ~ ' ago' if t not in ['unknown','unavailable'] else 'no visits yet' }}
    icon: mdi:cat
    icon_color: grey
    grid_options:
      columns: 6

  # Visit log (last 10)
  - type: markdown
    title: Recent visits
    content: |
      | Time | Cat | Weight | Duration |
      |:--|:--|--:|--:|
      {% for v in (state_attr('sensor.litter_box_last_visit', 'history') or [])[:10] -%}
      | {{ as_timestamp(v.time) | timestamp_custom('%d/%m %H:%M') }} | {% if v.cat == 'unidentified' %}❔ {{ 'probably ' ~ v.likely_cat ~ ' half inside' if v.reason == 'partial_after_visit' else 'no weight' if v.reason == 'no_weight' else 'refill or cat half inside' }}{% else %}{{ v.cat }}{% endif %} | {{ '%.2f kg' % v.weight if v.weight is not none else '–' }} | {{ '%d s' % v.duration if v.duration is not none else '–' }} |
      {% endfor %}

  # Weight trend per cat (long-term statistics)
  - type: statistics-graph
    title: Weight (30 days)
    days_to_show: 30
    period: day
    stat_types: [mean]
    chart_type: line
    entities:
      - entity: sensor.litter_box_luna_weight
        name: Luna
      - entity: sensor.litter_box_simba_weight
        name: Simba
